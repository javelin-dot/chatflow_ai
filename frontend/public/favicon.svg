<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Circuit lines -->
  <path d="M20 50 L35 50 L42 30" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M80 50 L65 50 L58 70" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="42" cy="30" r="2" fill="#334155"/>
  <circle cx="58" cy="70" r="2" fill="#334155"/>

  <!-- Main flow line -->
  <line x1="28" y1="50" x2="72" y2="50" stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Nodes -->
  <circle cx="28" cy="50" r="10" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="10" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="72" cy="50" r="10" fill="url(#node)" filter="url(#glow)"/>

  <!-- Node inner dots -->
  <circle cx="28" cy="50" r="4" fill="#0f172a"/>
  <circle cx="50" cy="50" r="4" fill="#0f172a"/>
  <circle cx="72" cy="50" r="4" fill="#0f172a"/>
</svg>
